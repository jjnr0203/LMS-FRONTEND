<p-toast />
<div class="surface-ground min-h-screen">
  <div class="text-white p-5 mb-5 border-round-xl" style="background: #064e3b">
    <h1 class="text-3xl font-semibold m-0 mb-2">Lista de Materias</h1>
    <p class="m-0" style="color: #d1fae5">Visualiza todas las materias registradas en el sistema.</p>
  </div>
  <div class="flex justify-content-center">
    <p-card styleClass="shadow-2" [style]="{ maxWidth: '1200px', width: '100%' }">
      <p-table
        [value]="subjects()"
        [loading]="loading()"
        [tableStyle]="{ 'min-width': '50rem' }"
        [paginator]="true"
        [rows]="10"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Créditos</th>
            <th>Descripción</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-subject>
          <tr>
            <td>{{ subject.id }}</td>
            <td><strong>{{ subject.code }}</strong></td>
            <td>{{ subject.name }}</td>
            <td>{{ subject.credits }}</td>
            <td>{{ subject.description || 'Sin descripción' }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">No se encontraron materias.</td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>
