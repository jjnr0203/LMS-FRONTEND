<p-toast />
<div class="surface-ground min-h-screen">
  <div class="bg-green-800 text-white p-5 mb-5 border-round-xl">
    <h1 class="text-3xl font-semibold m-0 mb-2">Cambiar Contraseña</h1>
    <p class="text-green-100 m-0">Actualiza tu contraseña de acceso.</p>
  </div>
  <div class="flex justify-content-center">
    <p-card styleClass="shadow-2" [style]="{ maxWidth: '600px', width: '100%' }">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="flex flex-column gap-2 mb-4">
          <label for="currentPassword" class="font-semibold text-sm text-700">Contraseña Actual</label>
          <p-password
            id="currentPassword"
            formControlName="currentPassword"
            [feedback]="false"
            [toggleMask]="true"
          />
          @if (currentPassword.invalid && currentPassword.touched) {
            <small class="p-error">Requerida.</small>
          }
        </div>
        <div class="flex flex-column gap-2 mb-4">
          <label for="newPassword" class="font-semibold text-sm text-700">Nueva Contraseña</label>
          <p-password id="newPassword" formControlName="newPassword" [toggleMask]="true" />
          @if (newPassword.invalid && newPassword.touched) {
            <small class="p-error">Mínimo 6 caracteres.</small>
          }
        </div>

        <div class="flex gap-2 mt-3">
          <p-button label="Cancelar" severity="secondary" variant="text" (onClick)="cancel()" />
          <p-button
            type="submit"
            label="Cambiar Contraseña"
            [loading]="loading()"
            [disabled]="form.invalid"
          />
        </div>
      </form>
    </p-card>
  </div>
</div>
