<p-toast />
<p-confirmDialog />
<div class="page-container">
  <!-- Dark Header -->
  <div class="page-header">
    <div class="header-content">
      <h1 class="title">Listado de <span>Matrículas</span></h1>
      <p class="description">
        Visualiza el estado de las matrículas y gestiona la matrícula de cada estudiante.
      </p>
    </div>
  </div>

  <!-- Main Content Card -->
  <div class="content-wrapper">
    <div class="data-card">
      <!-- Filters -->
      <div class="flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div class="flex align-items-center gap-2">
          <label class="font-semibold text-sm text-700">Estado</label>
          <p-select
            [options]="statusOptions"
            [ngModel]="statusFilter()"
            (ngModelChange)="statusFilter.set($event)"
            optionLabel="label"
            optionValue="value"
            placeholder="Filtrar por estado"
            styleClass="w-12rem"
          />
        </div>

        <div class="flex align-items-center gap-2">
          <p-iconField iconPosition="left" styleClass="w-20rem">
            <p-inputIcon styleClass="pi pi-search" />
            <input pInputText type="text" [ngModel]="searchTerm" (ngModelChange)="onSearchChange($event)" placeholder="Buscar por cédula o nombre..." class="w-full" />
          </p-iconField>
        </div>
      </div>

      <!-- Table -->
      <p-table
        [value]="filteredTuitions()"
        [loading]="loading()"
        [paginator]="true"
        [rows]="15"
        [tableStyle]="{ 'min-width': '40rem' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-t>
          <tr>
            <td>{{ t.studentId }}</td>
            <td>{{ fullName(t) }}</td>
            <td>
              <p-tag [value]="statusLabel(t.enrolled)" [severity]="statusSeverity(t.enrolled)" />
            </td>
            <td class="text-center">
              @if (!t.enrolled) {
                <p-button
                  label="Matricular"
                  icon="pi pi-user-plus"
                  size="small"
                  [rounded]="true"
                  [loading]="loading()"
                  (onClick)="confirmEnroll(t)"
                />
              } @else {
                <span class="text-500 text-sm">Ya matriculado</span>
              }
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center">No se encontraron resultados.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
