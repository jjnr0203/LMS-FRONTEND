<p-toast />
<div class="surface-ground min-h-screen">
  <div class="bg-green-800 text-white p-5 mb-5 border-round-xl">
    <h1 class="text-3xl font-semibold m-0 mb-2">Listado de Matrículas</h1>
    <p class="text-green-100 m-0">Visualiza el estado de las matrículas y los pagos de cada estudiante.</p>
  </div>
  <div class="flex justify-content-center">
    <p-card styleClass="shadow-2" [style]="{ maxWidth: '1200px', width: '100%' }">
      <p-table
        [value]="tuitions()"
        [loading]="loading()"
        [paginator]="true"
        [rows]="15"
        [tableStyle]="{ 'min-width': '50rem' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Cédula Estudiante</th>
            <th>Estado</th>
            <th>Cuotas</th>
            <th>Progreso</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-t>
          <tr>
            <td>{{ t.studentId }}</td>
            <td>
              <p-tag [value]="statusLabel(t.status)" [severity]="statusSeverity(t.status)" />
            </td>
            <td>{{ t.paidInstallments }} / 4</td>
            <td>
              <div style="width: 120px; height: 8px; background: #e2e8f0; border-radius: 6px; overflow: hidden;">
                <div
                  [style.height.%]="100"
                  [style.width.%]="(t.paidInstallments / 4) * 100"
                  [style.background]="progressColor(t.status)"
                  [style.borderRadius]="'6px'"
                  [style.transition]="'width 0.3s ease'"
                ></div>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center">No hay matrículas registradas.</td>
          </tr>
        </ng-template>
      </p-table>

      <div class="flex gap-3 mt-3 text-sm text-500">
        <span><i class="pi pi-circle-fill text-red-500 mr-1" style="font-size: 0.6rem"></i> No paga</span>
        <span><i class="pi pi-circle-fill text-yellow-500 mr-1" style="font-size: 0.6rem"></i> Pendiente</span>
        <span><i class="pi pi-circle-fill text-green-500 mr-1" style="font-size: 0.6rem"></i> Pagado total</span>
      </div>
    </p-card>
  </div>
</div>
