<p-toast />
<p-confirmDialog />
<div class="page-container">
  <!-- Dark Header -->
  <div class="page-header">
    <div class="header-content">
      <h1 class="title">Listado de <span>Matrículas</span></h1>
      <p class="description">
        Visualiza el estado de las matrículas y gestiona el pago completo o convenio de cada estudiante.
      </p>
    </div>
  </div>

  <!-- Main Content Card -->
  <div class="content-wrapper">
    <div class="data-card">
      <p-table
        [value]="tuitions()"
        [loading]="loading()"
        [paginator]="true"
        [rows]="15"
        [tableStyle]="{ 'min-width': '50rem' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Cuotas</th>
            <th class="text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-t>
          <tr>
            <td>{{ t.studentId }}</td>
            <td>{{ fullName(t) }}</td>
            <td>
              <p-tag [value]="statusLabel(t.status)" [severity]="statusSeverity(t.status)" />
            </td>
            <td>{{ t.paidInstallments }} / 4</td>
            <td class="text-center">
              <p-button
                icon="pi pi-ellipsis-v"
                [rounded]="true"
                [text]="true"
                styleClass="action-menu-btn"
                size="small"
                (onClick)="showMenu($event, menu, t)"
              />
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-center">No hay matrículas registradas.</td>
          </tr>
        </ng-template>
      </p-table>

      <div class="flex gap-3 mt-3 text-sm text-500">
        <span><i class="pi pi-circle-fill text-red-500 mr-1" style="font-size: 0.6rem"></i> No paga</span>
        <span><i class="pi pi-circle-fill text-blue-500 mr-1" style="font-size: 0.6rem"></i> Convenio</span>
        <span><i class="pi pi-circle-fill text-yellow-500 mr-1" style="font-size: 0.6rem"></i> Pendiente</span>
        <span><i class="pi pi-circle-fill text-green-500 mr-1" style="font-size: 0.6rem"></i> Pagado total</span>
      </div>
    </div>
  </div>
</div>

<p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" [style]="{ width: '140px' }"></p-menu>
