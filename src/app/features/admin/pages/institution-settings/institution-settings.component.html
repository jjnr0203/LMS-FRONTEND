<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-container">
  <!-- Dark Header -->
  <div class="page-header">
    <div class="header-content">
      <h1 class="title">Configuración de la <span>Institución</span></h1>
      <p class="description">Gestiona los datos generales y de contacto de tu institución. Esta información se usará en documentos y PDFs oficiales.</p>
    </div>
  </div>

  <!-- Content -->
  <div class="content-wrapper">

    @if (loading()) {
      <div class="flex justify-content-center align-items-center" style="height: 300px;">
        <i class="pi pi-spin pi-spinner text-5xl" style="color: #064e3b;"></i>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="save()">

        <!-- Card 1: Logo e Información General -->
        <div class="data-card mb-4">
          <div class="section-header mb-3">
            <h3 class="m-0 text-900 text-xl font-bold">Información General</h3>
          </div>
          
          <div class="flex flex-column md:flex-row align-items-center gap-8">
            <!-- Logo Izquierda -->
            <div class="logo-section flex-shrink-0 flex justify-content-center relative">
              <div class="logo-wrapper relative cursor-pointer border-circle" style="width: 180px; height: 180px;" (click)="logoUpload.click()">
                @if (currentLogoUrl()) {
                  <img [src]="currentLogoUrl()!" alt="Logo" class="w-full h-full object-cover shadow-2 border-circle" />
                } @else {
                  <div class="logo-placeholder w-full h-full flex align-items-center justify-content-center shadow-2 border-circle" style="background: #f1f5f9; color: #064e3b;">
                    <i class="pi pi-building text-6xl"></i>
                  </div>
                }
                <div class="logo-overlay border-circle">
                  <i class="pi pi-camera"></i>
                  <span>Cambiar</span>
                </div>
                <input type="file" #logoUpload (change)="onLogoSelected($event)" accept="image/*" class="hidden" />
              </div>
              
              <!-- Botón Eliminar Sutil -->
              @if (currentLogoUrl()) {
                <button 
                  type="button"
                  class="absolute flex align-items-center justify-content-center bg-white border-circle shadow-2 cursor-pointer text-red-500 hover:text-red-700 transition-colors z-2" 
                  style="width: 36px; height: 36px; bottom: 8px; right: 8px; border: none; padding: 0;"
                  (click)="onDeleteLogo($event)"
                  title="Eliminar logo"
                >
                  <i class="pi pi-trash text-lg"></i>
                </button>
              }
            </div>

            <!-- Formulario Derecha -->
            <div class="flex-1 w-full">
              <div class="formgrid grid">
                <div class="field col-12 mb-3">
                  <label for="name" class="block font-medium text-700 mb-2">Nombre de la Institución</label>
                  <input id="name" type="text" pInputText formControlName="name" class="w-full" placeholder="Ej: Instituto Superior Tecnológico..." />
                </div>
                <div class="field col-12 md:col-6 mb-3">
                  <label for="ruc" class="block font-medium text-700 mb-2">RUC</label>
                  <input id="ruc" type="text" pInputText formControlName="ruc" class="w-full" placeholder="Ej: 1790012345001" />
                </div>
                <div class="field col-12 md:col-6 mb-3">
                  <label for="website" class="block font-medium text-700 mb-2">Sitio Web</label>
                  <input id="website" type="text" pInputText formControlName="website" class="w-full" placeholder="Ej: https://www.institucion.edu.ec" />
                </div>
                <div class="field col-12 mb-3">
                  <label for="slogan" class="block font-medium text-700 mb-2">Eslogan</label>
                  <input id="slogan" type="text" pInputText formControlName="slogan" class="w-full" placeholder="Ej: Formando profesionales para el futuro" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2: Datos de Contacto -->
        <div class="data-card mb-4">
          <div class="section-header mb-3">
            <h3 class="m-0 text-900 text-xl font-bold">Datos de Contacto</h3>
          </div>
          <div class="formgrid grid">
            <div class="field col-12 md:col-6 mb-3">
              <label for="address" class="block font-medium text-700 mb-2">Dirección Física</label>
              <input id="address" type="text" pInputText formControlName="address" class="w-full" placeholder="Ej: Av. Principal 123, Ciudad, Provincia" />
            </div>
            <div class="field col-12 md:col-6 mb-3">
              <label for="email" class="block font-medium text-700 mb-2">Correo Institucional</label>
              <input id="email" type="email" pInputText formControlName="email" class="w-full" placeholder="Ej: info@institucion.edu.ec" />
            </div>
            <div class="field col-12 md:col-6 mb-3">
              <label for="phone" class="block font-medium text-700 mb-2">Teléfono Fijo</label>
              <input id="phone" type="text" pInputText formControlName="phone" class="w-full" placeholder="Ej: 02-2345678" />
            </div>
            <div class="field col-12 md:col-6 mb-3">
              <label for="mobile" class="block font-medium text-700 mb-2">Celular</label>
              <input id="mobile" type="text" pInputText formControlName="mobile" class="w-full" placeholder="Ej: 0991234567" />
            </div>
          </div>
          <div class="actions-bar mt-2">
            <button pButton type="submit" [loading]="saving()" label="Guardar Cambios" icon="pi pi-save" class="save-btn"></button>
          </div>
        </div>

      </form>
    }

  </div>
</div>
