  <div class="flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div class="flex align-items-center gap-3">
      <h3 class="m-0 text-xl font-medium text-800">Ciclos Académicos</h3>
      <p-button label="Nuevo Ciclo" icon="pi pi-plus" (onClick)="openNew()" severity="success" size="small"></p-button>
    </div>
  </div>

  <p-table [value]="terms" [paginator]="true" [rows]="10" styleClass="p-datatable-sm" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Fecha Inicio</th>
        <th>Fecha Fin</th>
        <th>Estado</th>
        <th style="width: 120px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-term>
      <tr>
        <td class="font-medium text-slate-800">{{ term.name }}</td>
        <td class="text-slate-600">{{ term.startDate | date:'mediumDate' }}</td>
        <td class="text-slate-600">{{ term.endDate | date:'mediumDate' }}</td>
        <td>
          <span class="px-2 py-1 text-xs font-semibold rounded-full"
                [class.bg-emerald-100]="term.isActive" [class.text-emerald-800]="term.isActive"
                [class.bg-slate-100]="!term.isActive" [class.text-slate-600]="!term.isActive">
            {{ term.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <div class="flex gap-2">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="editTerm(term)" size="small" ></p-button>
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteTerm(term.id)" size="small" ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-4 text-slate-500">No se encontraron ciclos académicos.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog [(visible)]="displayDialog" [header]="isEdit ? 'Editar Ciclo' : 'Nuevo Ciclo'" [modal]="true" [style]="{ width: '800px', 'max-width': '95vw' }" [closable]="true" appendTo="body">
    <form [formGroup]="termForm" (ngSubmit)="saveTerm()" class="mt-3">
      <div class="grid">
        <div class="col-12 md:col-12">
          <div class="flex flex-column gap-2 mb-4">
            <label for="name" class="font-semibold text-sm text-slate-700">Nombre (Ej: 2024-I)</label>
            <input pInputText id="name" formControlName="name" placeholder="Ingrese el nombre del ciclo" class="w-full" />
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="flex flex-column gap-2 mb-4">
            <label for="startDate" class="font-semibold text-sm text-slate-700">Fecha de Inicio</label>
            <input pInputText type="date" id="startDate" formControlName="startDate" class="w-full" />
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="flex flex-column gap-2 mb-4">
            <label for="endDate" class="font-semibold text-sm text-slate-700">Fecha de Fin</label>
            <input pInputText type="date" id="endDate" formControlName="endDate" class="w-full" />
          </div>
        </div>
        <div class="col-12">
          <div class="flex align-items-center gap-2 mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="font-semibold text-sm text-slate-700 cursor-pointer">Marcar como Activo (Desactivará otros)</label>
          </div>
        </div>
      </div>

      <div class="flex justify-content-end gap-2 mt-4">
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayDialog = false"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="termForm.invalid" severity="success"></p-button>
      </div>
    </form>
  </p-dialog>
