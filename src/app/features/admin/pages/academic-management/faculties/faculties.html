  <div class="flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div class="flex align-items-center gap-3">
      <h3 class="m-0 text-xl font-medium text-800">Facultades</h3>
      <p-button label="Nueva Facultad" icon="pi pi-plus" (onClick)="openNew()" severity="success" size="small"></p-button>
    </div>
  </div>

  <p-table [value]="faculties" [paginator]="true" [rows]="10" styleClass="p-datatable-sm" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Código</th>
        <th>Estado</th>
        <th>Descripción</th>
        <th style="width: 120px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-f>
      <tr>
        <td class="font-medium text-slate-800">{{ f.name }}</td>
        <td>
          <p-tag [value]="f.code" severity="info" [style]="{'white-space': 'nowrap'}"></p-tag>
        </td>
        <td>
          <span class="px-2 py-1 text-xs font-semibold rounded-full"
                [class.bg-emerald-100]="f.isActive" [class.text-emerald-800]="f.isActive"
                [class.bg-slate-100]="!f.isActive" [class.text-slate-600]="!f.isActive">
            {{ f.isActive ? 'Activa' : 'Inactiva' }}
          </span>
        </td>
        <td class="text-sm text-slate-500 max-w-xs truncate" [title]="f.description">{{ f.description }}</td>
        <td>
          <div class="flex gap-2">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="editFaculty(f)" size="small" ></p-button>
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteFaculty(f.id)" size="small" ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center py-4 text-slate-500">No se encontraron facultades.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog [(visible)]="displayDialog" [header]="isEdit ? 'Editar Facultad' : 'Nueva Facultad'" [modal]="true" [style]="{ width: '800px', 'max-width': '95vw' }" [closable]="true" appendTo="body">
    <form [formGroup]="form" (ngSubmit)="saveFaculty()" class="mt-3">
      <div class="grid">
        <div class="col-12 md:col-6">
          <div class="flex flex-column gap-2 mb-4">
            <label for="name" class="font-semibold text-sm text-slate-700">Nombre *</label>
            <input pInputText id="name" formControlName="name" placeholder="Ej: Facultad de Ingeniería" class="w-full" />
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="flex flex-column gap-2 mb-4">
            <label for="code" class="font-semibold text-sm text-slate-700">Código *</label>
            <input pInputText id="code" formControlName="code" placeholder="Ej: FI" class="w-full" />
          </div>
        </div>
        <div class="col-12 md:col-12">
          <div class="flex flex-column gap-2 mb-4">
            <label for="description" class="font-semibold text-sm text-slate-700">Descripción (Opcional)</label>
            <textarea pTextarea id="description" formControlName="description" rows="3" placeholder="Descripción de la facultad" class="w-full"></textarea>
          </div>
        </div>
        <div class="col-12">
          <div class="flex align-items-center gap-2 mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActiveF"></p-checkbox>
            <label for="isActiveF" class="font-semibold text-sm text-slate-700 cursor-pointer">Activa</label>
          </div>
        </div>
      </div>

      <div class="flex justify-content-end gap-2 mt-4">
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayDialog = false"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="form.invalid" severity="success"></p-button>
      </div>
    </form>
  </p-dialog>
