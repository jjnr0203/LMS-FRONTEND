<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-container">
  <!-- Dark Header -->
  <div class="page-header">
    <div class="header-content">
      <h1 class="title">Gestión Académica</h1>
      <p class="description">Administra los ciclos académicos, modalidades, carreras y materias.</p>
    </div>
  </div>

  <!-- Main Content Card -->
  <div class="content-wrapper">
    <div class="data-card">
    <p-tabs [value]="activeTab" (valueChange)="activeTab = $event; onTabChange($event)">
      <p-tablist>
        <p-tab value="0">Ciclos Académicos</p-tab>
        <p-tab value="1">Modalidades</p-tab>
        <p-tab value="2">Carreras</p-tab>
        <p-tab value="3">Facultades</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="0">
          <app-academic-terms></app-academic-terms>
        </p-tabpanel>
        <p-tabpanel value="1">
          <app-modalities></app-modalities>
        </p-tabpanel>
        <p-tabpanel value="2">
          <app-careers></app-careers>
        </p-tabpanel>
        <p-tabpanel value="3">
          <app-faculties></app-faculties>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
</div>
