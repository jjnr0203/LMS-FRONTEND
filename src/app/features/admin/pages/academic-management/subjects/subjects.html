<div class="p-4">
  <div class="flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div class="flex align-items-center gap-3">
      <h3 class="m-0 text-xl font-medium text-800">Materias</h3>
      <p-button label="Nueva Materia" icon="pi pi-plus" (onClick)="openNew()" severity="success" size="small"></p-button>
    </div>
  </div>

  <p-table [value]="subjects" [paginator]="true" [rows]="10" styleClass="p-datatable-sm" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Créditos</th>
        <th>Docente</th>
        <th>Descripción</th>
        <th style="width: 120px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-s>
      <tr>
        <td class="font-medium text-slate-600">{{ s.code }}</td>
        <td class="font-medium text-slate-800">{{ s.name }}</td>
        <td>{{ s.credits }}</td>
        <td>{{ getTeacherName(s.teacherId) }}</td>
        <td class="text-sm text-slate-500 max-w-xs truncate" [title]="s.description">{{ s.description }}</td>
        <td>
          <div class="flex gap-2">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="editSubject(s)"></p-button>
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteSubject(s.id)"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center py-4 text-slate-500">No se encontraron materias.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog [(visible)]="displayDialog" [header]="isEdit ? 'Editar Materia' : 'Nueva Materia'" [modal]="true" [style]="{ width: '800px', 'max-width': '95vw' }" [closable]="true" appendTo="body">
    <form [formGroup]="form" (ngSubmit)="saveSubject()" class="mt-3">
      <div class="grid">
        <div class="col-12 md:col-12">
          <div class="flex flex-column gap-2 mb-3">
            <label for="name" class="font-semibold text-sm text-slate-700">Nombre de la Materia</label>
            <input pInputText id="name" formControlName="name" placeholder="Ej: Álgebra Lineal" class="w-full" />
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="flex flex-column gap-2 mb-3">
            <label for="code" class="font-semibold text-sm text-slate-700">Código</label>
            <input pInputText id="code" formControlName="code" placeholder="Ej: ALG101" class="w-full" />
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="flex flex-column gap-2 mb-3">
            <label for="credits" class="font-semibold text-sm text-slate-700">Créditos</label>
            <p-inputNumber formControlName="credits" inputId="credits" [min]="1" [max]="20" [useGrouping]="false" styleClass="w-full" class="w-full"></p-inputNumber>
          </div>
        </div>
        <div class="col-12 md:col-12">
          <div class="flex flex-column gap-2 mb-3">
            <label for="teacherId" class="font-semibold text-sm text-slate-700">Docente a cargo</label>
            <p-select formControlName="teacherId" [options]="teachers" optionLabel="firstName" optionValue="id" placeholder="Seleccione un docente" [filter]="true" filterBy="firstName,lastName" [showClear]="true" styleClass="w-full">
              <ng-template let-tch pTemplate="item">
                {{tch.firstName}} {{tch.lastName}}
              </ng-template>
              <ng-template let-tch pTemplate="selectedItem">
                {{tch ? tch.firstName + ' ' + tch.lastName : 'Seleccione un docente'}}
              </ng-template>
            </p-select>
          </div>
        </div>
        <div class="col-12 md:col-12">
          <div class="flex flex-column gap-2 mb-3">
            <label for="description" class="font-semibold text-sm text-slate-700">Descripción (Opcional)</label>
            <textarea pTextarea id="description" formControlName="description" rows="3" class="w-full"></textarea>
          </div>
        </div>
      </div>

      <div class="flex justify-content-end gap-2 mt-4">
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayDialog = false"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="form.invalid" severity="success"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
